name: api-ci

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: api/go.sum

      - name: build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: api/go.sum

      - name: test
        run: go test -v ./...

  k6-functional-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: api/go.sum

      - name: setup k6
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/k6.tar.gz" https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  $RUNNER_TEMP/k6.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          echo "K6_BINARY=$RUNNER_TEMP/k6-v2.3.0-linux-amd64/k6" >> "$GITHUB_ENV"

      - name: real k6 and loopback HTTP functional tests
        run: go test -v ./cmd/loadtest -run TestK6 -count=1

  integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: threadly_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:password@127.0.0.1:3307/threadly_test
      TEST_DATABASE_DSN: root:password@tcp(127.0.0.1:3307)/threadly_test?parseTime=True
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: api/go.sum

      - name: setup atlas
        uses: ariga/setup-atlas@v0

      - name: integration test
        run: make ENV_FILE=/dev/null GO_TEST='go test -count=1' integration-test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: api/go.sum

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          working-directory: api

  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: api/go.sum

      - name: vulnerability check
        run: make vulncheck
