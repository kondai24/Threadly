services:
  db:
    image: mysql:8.0.36
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: go_post
      TZ: "Asia/Tokyo"
    volumes:
      - ./db/my.conf:/etc/mysql/conf.d/my.cnf:ro
      - db_data:/var/lib/mysql
    ports:
      - 3306:3306

  test-db:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: threadly_test
      TZ: "Asia/Tokyo"
    volumes:
      - ./db/my.conf:/etc/mysql/conf.d/my.cnf:ro
      - test_db_data:/var/lib/mysql
    ports:
      - 3307:3306

volumes:
  db_data:
  test_db_data:
