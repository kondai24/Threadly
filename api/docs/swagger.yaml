definitions:
  Threadly_internal_interface_dto.AuthResponse:
    properties:
      user:
        $ref: '#/definitions/Threadly_internal_interface_dto.UserResponse'
    type: object
  Threadly_internal_interface_dto.CommentResponse:
    properties:
      author:
        $ref: '#/definitions/Threadly_internal_interface_dto.PublicUserResponse'
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      replies:
        items:
          $ref: '#/definitions/Threadly_internal_interface_dto.CommentResponse'
        type: array
      updatedAt:
        type: string
    type: object
  Threadly_internal_interface_dto.CreateCommentRequest:
    properties:
      content:
        example: コメント本文
        maxLength: 1000
        minLength: 1
        type: string
      parentId:
        example: 33333333-3333-4333-8333-333333333333
        type: string
    required:
    - content
    type: object
  Threadly_internal_interface_dto.CreatePostRequest:
    properties:
      content:
        type: string
      title:
        type: string
    required:
    - content
    - title
    type: object
  Threadly_internal_interface_dto.CredentialsRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  Threadly_internal_interface_dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  Threadly_internal_interface_dto.PostDetailResponse:
    properties:
      author:
        $ref: '#/definitions/Threadly_internal_interface_dto.PublicUserResponse'
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  Threadly_internal_interface_dto.PostListResponse:
    properties:
      author:
        $ref: '#/definitions/Threadly_internal_interface_dto.PublicUserResponse'
      createdAt:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  Threadly_internal_interface_dto.PublicUserResponse:
    properties:
      id:
        type: string
      username:
        type: string
    type: object
  Threadly_internal_interface_dto.UpdateCommentRequest:
    properties:
      content:
        example: 更新したコメント本文
        maxLength: 1000
        minLength: 1
        type: string
    required:
    - content
    type: object
  Threadly_internal_interface_dto.UpdatePostRequest:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  Threadly_internal_interface_dto.UserResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Threadly learning API with username/password authentication and authenticated
    post browsing.
  title: Thready API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with a username and password, then set an authenticated
        session cookie.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Threadly_internal_interface_dto.CredentialsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Clear the authenticated session cookie.
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create a user with a username and password, then set an authenticated
        session cookie.
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Threadly_internal_interface_dto.CredentialsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      summary: Register a user
      tags:
      - auth
  /api/comments/{id}:
    delete:
      description: Soft-delete a comment and its direct replies when the authenticated
        user is its author.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Delete a comment
      tags:
      - comments
    put:
      consumes:
      - application/json
      description: Update a comment when the authenticated user is its author.
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Update comment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Threadly_internal_interface_dto.UpdateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Update a comment
      tags:
      - comments
  /api/me:
    get:
      description: Return the user represented by the authenticated session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Get current user
      tags:
      - auth
  /api/posts:
    get:
      description: Get all posts visible to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Threadly_internal_interface_dto.PostListResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: List posts
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Create a post owned by the authenticated user.
      parameters:
      - description: Create post payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Threadly_internal_interface_dto.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Create post
      tags:
      - posts
  /api/posts/{id}:
    delete:
      description: Delete a post when it is owned by the authenticated user.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Delete current user's post
      tags:
      - posts
    get:
      description: Get a post by ID when it is visible to the authenticated user.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.PostDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Get post by ID
      tags:
      - posts
    put:
      consumes:
      - application/json
      description: Update a post when it is owned by the authenticated user.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Update post payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Threadly_internal_interface_dto.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Update current user's post
      tags:
      - posts
  /api/posts/{id}/comments:
    get:
      description: Get active comments nested by root comment and one-level replies.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Threadly_internal_interface_dto.CommentResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: List comments for a post
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Create a root comment or one-level reply for a post.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Create comment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Threadly_internal_interface_dto.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Threadly_internal_interface_dto.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Create a comment
      tags:
      - comments
securityDefinitions:
  SessionCookie:
    description: HttpOnly, Secure, SameSite session cookie.
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
