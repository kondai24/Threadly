definitions:
  internal_interface_controllers.CreatePostRequest:
    properties:
      content:
        type: string
      title:
        type: string
    required:
    - content
    - title
    type: object
  internal_interface_controllers.UpdatePostRequest:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  internal_interface_controllers.authResponse:
    properties:
      user:
        $ref: '#/definitions/internal_interface_controllers.userResponse'
    type: object
  internal_interface_controllers.credentialsRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_interface_controllers.postAuthorResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  internal_interface_controllers.postDetailResponse:
    properties:
      author:
        $ref: '#/definitions/internal_interface_controllers.postAuthorResponse'
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  internal_interface_controllers.postListResponse:
    properties:
      author:
        $ref: '#/definitions/internal_interface_controllers.postAuthorResponse'
      createdAt:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  internal_interface_controllers.userResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      updatedAt:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Threadly learning API with username/password authentication and authenticated
    post browsing.
  title: Thready API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with a username and password, then set an authenticated
        session cookie.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interface_controllers.credentialsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_interface_controllers.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Clear the authenticated session cookie.
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create a user with a username and password, then set an authenticated
        session cookie.
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interface_controllers.credentialsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_interface_controllers.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register a user
      tags:
      - auth
  /api/me:
    get:
      description: Return the user represented by the authenticated session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_interface_controllers.userResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: Get current user
      tags:
      - auth
  /api/posts:
    get:
      description: Get all posts visible to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_interface_controllers.postListResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: List posts
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Create a post owned by the authenticated user.
      parameters:
      - description: Create post payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interface_controllers.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: Create post
      tags:
      - posts
  /api/posts/{id}:
    delete:
      description: Delete a post when it is owned by the authenticated user.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: Delete current user's post
      tags:
      - posts
    get:
      description: Get a post by ID when it is visible to the authenticated user.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_interface_controllers.postDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: Get post by ID
      tags:
      - posts
    put:
      consumes:
      - application/json
      description: Update a post when it is owned by the authenticated user.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update post payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interface_controllers.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: Update current user's post
      tags:
      - posts
securityDefinitions:
  SessionCookie:
    description: HttpOnly, Secure, SameSite session cookie.
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
